name: PHP Security Checker

# Least privilege for the GITHUB_TOKEN (read-only; PR file lists are read by ci-setup).
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:

jobs:
  security-checker:
    name: PHP Security Checker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ "8.4" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run composer install
        run: |
          composer install --no-interaction

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-db
        with:
          path: ~/.symfony/cache
          key: db-${{ matrix.php-version }}

      - uses: symfonycorp/security-checker-action@258311ef7ac571f1310780ef3d79fc5abef642b5 # v5
